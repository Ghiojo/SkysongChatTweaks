name: SkysongChatTweaks
version: '${version}'
main: org.skysongdev.skysongchattweaks.SkysongChatTweaks
api-version: '1.21'
# Both must be enabled first: the chat tags read OpenRP's channels and the SkysongStats API.
depend: [OpenRP, SkysongStats]
commands:
  play:
    description: Links a played song
    usage: /play <link> <title>
    permission: skysongchattweaks.play
  screload:
    description: Reloads config.yml
    usage: /screload
    permission: skysongchattweaks.reload
permissions:
  skysongchattweaks.play:
    description: Use /play
    default: true
  skysongchattweaks.reload:
    description: Use /screload
    default: op
